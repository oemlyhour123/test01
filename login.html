<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1f36">
  <meta name="description" content="ប្រព័ន្ធគ្រប់គ្រងការជួលបន្ទប់ និងការគិតថ្លៃប្រចាំខែ">
  <title>ចូលប្រើប្រាស់ | ប្រព័ន្ធគ្រប់គ្រងការជួលបន្ទប់</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/khmer-fonts.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body class="login-body" data-page="login">

  <main class="login-layout">
    <section class="login-brand" aria-label="RRMS">
      <div class="login-brand-top">
        <span class="brand-mark brand-mark-large" data-icon="building" data-size="26"></span>
        <div class="brand-text brand-text-light">
          <strong data-i18n="app.title"></strong>
          <small>RRMS • PHASE 1</small>
        </div>
      </div>

      <div class="login-brand-copy">
        <p class="eyebrow eyebrow-light">RESIDENTIAL RENTAL MANAGEMENT</p>
        <h1 data-i18n="login.brandHeadline"></h1>
        <p class="login-brand-body" data-i18n="login.brandBody"></p>
        <ul class="login-features">
          <li><span class="login-feature-icon" data-icon="checkout" data-size="16"></span><span data-i18n="login.feature1"></span></li>
          <li><span class="login-feature-icon" data-icon="checkout" data-size="16"></span><span data-i18n="login.feature2"></span></li>
          <li><span class="login-feature-icon" data-icon="checkout" data-size="16"></span><span data-i18n="login.feature3"></span></li>
        </ul>
      </div>

      <div class="login-brand-footer">
        <span data-icon="key" data-size="16"></span>
        <span data-i18n="login.secure"></span>
      </div>

      <div class="login-brand-glow login-brand-glow-a" aria-hidden="true"></div>
      <div class="login-brand-glow login-brand-glow-b" aria-hidden="true"></div>
      <div class="login-grid-pattern" aria-hidden="true"></div>
    </section>

    <section class="login-panel">
      <div class="login-panel-top">
        <div class="lang-segment" role="group" aria-label="Language">
          <button type="button" data-lang-inline="km" class="is-active">ខ្មែរ</button>
          <button type="button" data-lang-inline="en">English</button>
        </div>
      </div>

      <div class="login-card">
        <div class="login-mobile-brand">
          <span class="brand-mark" data-icon="building" data-size="22"></span>
          <span class="brand-text"><strong data-i18n="app.title"></strong><small>RRMS</small></span>
        </div>

        <p class="eyebrow" data-i18n="login.welcome"></p>
        <h2 class="login-title" data-i18n="login.subtitle"></h2>

        <form id="loginForm" class="login-form" novalidate>
          <div class="form-field">
            <label for="email" data-i18n="login.email"></label>
            <div class="input-with-icon">
              <span class="input-icon" data-icon="user" data-size="18"></span>
              <input type="email" id="email" name="email" autocomplete="username" inputmode="email"
                     placeholder="ឧ. admin@rrms.local" data-i18n-placeholder="login.emailPlaceholder" required>
            </div>
          </div>

          <div class="form-field">
            <label for="password" data-i18n="login.password"></label>
            <div class="input-with-icon">
              <span class="input-icon" data-icon="key" data-size="18"></span>
              <input type="password" id="password" name="password" autocomplete="current-password"
                     placeholder="បញ្ចូលពាក្យសម្ងាត់" data-i18n-placeholder="login.passwordPlaceholder" required>
              <button type="button" id="togglePassword" class="input-action" aria-label="បង្ហាញពាក្យសម្ងាត់"></button>
            </div>
          </div>

          <div class="form-error" id="formError" role="alert" hidden></div>

          <button type="submit" class="button button-primary button-block" id="submitButton">
            <span class="spinner" hidden></span>
            <span class="button-label" data-i18n="login.signIn"></span>
            <span class="button-arrow" data-icon="arrowRight" data-size="18"></span>
          </button>
        </form>

        <div class="demo-box" id="demoBox">
          <div class="demo-box-head">
            <span class="demo-box-icon" data-icon="info" data-size="18"></span>
            <strong data-i18n="login.demoTitle"></strong>
            <span class="demo-tag">DEMO</span>
          </div>
          <p data-i18n="login.demoHint"></p>
          <div class="demo-credentials">
            <code>admin@rrms.local</code>
            <span aria-hidden="true">/</span>
            <code>rrms2026</code>
          </div>
          <div class="demo-actions">
            <button type="button" class="button button-secondary button-small" id="demoFill" data-i18n="login.fillDemo"></button>
            <button type="button" class="button button-ghost button-small" id="demoLogin" data-i18n="login.demoButton"></button>
          </div>
        </div>

        <p class="login-footer" data-i18n="login.footer"></p>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/format.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
